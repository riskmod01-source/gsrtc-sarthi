name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Repair and Force Upgrade Gradle
        run: |
          cd ..
          flutter create --org com.gsrtc --project-name gsrtc_sarthi temp_app
          cp -r temp_app/android $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSRTC-Sarthi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
